<!DOCTYPE html>
<html>

<head>
    <title>Blood Group Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }

        img {
            margin-top: 15px;
            max-width: 100%;
            border-radius: 6px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        h2 {
            color: #333;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>🩸 Blood Group Detection</h2>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="image" required>
            <br>
            <button type="submit">Predict</button>
        </form>

        {% if image_path %}
        <img src="{{ image_path }}">
        {% endif %}

        {% if prediction %}
        <h3>Prediction: {{ prediction }}</h3>
        {% endif %}
    </div>

</body>

</html>
